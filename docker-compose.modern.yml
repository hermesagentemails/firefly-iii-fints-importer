version: '3.8'

services:
  php-backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"        # PHP backend on host 8081, container 8080
    volumes:
      - ./data:/data
      - ./configurations:/app/configurations
    environment:
      - APP_PORT=8080
    restart: unless-stopped
    networks:
      - firefly-network

  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile-node
    ports:
      - "3000:3000"       # Node frontend on host 3000, container 3000
    volumes:
      - ./assets:/home/node/app/public
      - ./node_modules:/home/node/app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev -- --host 0.0.0.0 --port 3000
    restart: unless-stopped
    networks:
      - firefly-network

  nginx-proxy:
    image: nginx:alpine
    ports:
      - "80:80"           # HTTP access
      - "443:443"         # HTTPS (will need certificates)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - php-backend
      - frontend-dev
    restart: unless-stopped
    networks:
      - firefly-network

networks:
  firefly-network:
    driver: bridge